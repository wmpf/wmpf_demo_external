apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdk 32
    defaultConfig {
        applicationId "com.tencent.wmpf.demo"
        minSdkVersion 25
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 32
        versionCode 1
        versionName "1.0"
        if (file("local.properties").exists()) {
            // Load from local.properties
            def localProperties = new Properties()
            file("local.properties").withInputStream { localProperties.load(it) }
            // WARNING: WXA Apps run on each host AppId could be limited.
            buildConfigField 'String', 'HOST_APPID', "\"${localProperties.getProperty('HOST_APPID') ?: 'REPLACE_WITH_REAL_VALUE'}\""
            // DANGEROUS! 危险！APP_SECRET 需要严格保密
            buildConfigField 'String', 'HOST_APPSECRET', "\"${localProperties.getProperty('HOST_APPSECRET') ?: 'REPLACE_WITH_REAL_VALUE'}\""

            // WARNING: 仅作开发调试使用，正式应用中以下属性不应为编译期参数
            buildConfigField 'int', 'WMPF_PRODUCT_ID', "${localProperties.getProperty('WMPF_PRODUCT_ID') ?: 0}"
            buildConfigField 'int', 'WMPF_KEY_VERSION', "${localProperties.getProperty('WMPF_KEY_VERSION') ?: 0}"
            buildConfigField 'String', 'WMPF_DEVICE_ID', "\"${localProperties.getProperty('WMPF_DEVICE_ID') ?: 'REPLACE_WITH_REAL_VALUE'}\""
            buildConfigField 'String', 'WMPF_SIGNATURE', "\"${localProperties.getProperty('WMPF_SIGNATURE') ?: 'REPLACE_WITH_REAL_VALUE'}\""
        } else {
            // WARNING: WXA Apps run on each host AppId could be limited.
            buildConfigField 'String', 'HOST_APPID', "\"REPLACE_WITH_REAL_VALUE\""
            // DANGEROUS! 危险！APP_SECRET 需要严格保密
            buildConfigField 'String', 'HOST_APPSECRET', "\"REPLACE_WITH_REAL_VALUE\""

            // WARNING: 仅作开发调试使用，正式应用中以下属性不应为编译期参数
            buildConfigField 'int', 'WMPF_PRODUCT_ID', "0"
            buildConfigField 'int', 'WMPF_KEY_VERSION', "0"
            buildConfigField 'String', 'WMPF_DEVICE_ID', "\"REPLACE_WITH_REAL_VALUE\""
            buildConfigField 'String', 'WMPF_SIGNATURE', "\"REPLACE_WITH_REAL_VALUE\""
        }

        // 仅在需要使用小程序设备认证的情况下需要指定 WXA_APPID, WXA_APPSECRET, WXA_MODEL_ID
        // TODO: 替换成开发者在微信公众平台申请的小程序 AppId
        buildConfigField 'String', 'WXA_APPID', '"REPLACE_WITH_REAL_VALUE"'
        // TODO: DANGEROUS! 危险！仅供测试使用，APP_SECRET 需要严格保密，不应流出服务端后台环境，更不应该放到客户端代码中。
        buildConfigField 'String', 'WXA_APPSECRET', '"REPLACE_WITH_REAL_VALUE"'
        buildConfigField 'String', 'WXA_MODEL_ID', '"REPLACE_WITH_REAL_VALUE"'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    signingConfigs {
        debug {
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
        }
        release {
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    flavorDimensions += 'product'
    productFlavors {
        guide {
            dimension 'product'
            applicationIdSuffix ".demo"
            versionNameSuffix "-demo"
        }
        experience {
            dimension 'product'
            applicationIdSuffix ".experience"
            versionNameSuffix "-experience"
        }
    }
    namespace 'com.tencent.wmpf.demo'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    implementation 'junit:junit:4.12'

    implementation "com.google.code.gson:gson:2.8.5"

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.multidex:multidex:2.0.1'

    api 'com.squareup.okhttp3:okhttp:4.11.0'
    api 'cn.yipianfengye.android:zxing-library:2.2'
}
